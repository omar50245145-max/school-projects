<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    * { box-sizing: border-box; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; }
    a { color: #9c7526; }
    a:hover { color: #6e5019; }
  </style>
</helmet>

<div dir="rtl" style="width:794px; height:1123px; background:#f7f1e5; padding:34px; position:relative;">
  <div style="width:100%; height:100%; background:#fffcf5; border:3px double #312f2a; border-radius:6px; padding:56px 48px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; position:relative;">

    <!-- decorative corner ornaments -->
    <div style="position:absolute; top:14px; right:14px; width:26px; height:26px; border-top:2px solid #9c7526; border-right:2px solid #9c7526;"></div>
    <div style="position:absolute; top:14px; left:14px; width:26px; height:26px; border-top:2px solid #9c7526; border-left:2px solid #9c7526;"></div>
    <div style="position:absolute; bottom:14px; right:14px; width:26px; height:26px; border-bottom:2px solid #9c7526; border-right:2px solid #9c7526;"></div>
    <div style="position:absolute; bottom:14px; left:14px; width:26px; height:26px; border-bottom:2px solid #9c7526; border-left:2px solid #9c7526;"></div>

    <!-- Top: school logo (right) + department logo (left) -->
    <div style="display:flex; align-items:center; justify-content:center; gap:64px;">
      <div style="width:118px; height:118px; border-radius:50%; overflow:hidden; border:2.5px solid #312f2a; background:#fffcf5;">
        <img src="school-logo.jpg" alt="شعار المدرسة" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div style="width:118px; height:118px; border-radius:50%; overflow:hidden; border:2.5px solid #312f2a; background:#fffcf5;">
        <img src="dept-logo.jpg" alt="شعار القسم" style="width:100%; height:100%; object-fit:cover;">
      </div>
    </div>

    <!-- Middle: title + academic year -->
    <div style="display:flex; flex-direction:column; align-items:center; gap:22px; text-align:center;">
      <h1 style="margin:0; font-family:'Noto Naskh Arabic', serif; font-weight:700; font-size:46px; color:#312f2a; line-height:1.35;">سجل زيارات الموجه</h1>
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="width:34px; height:1px; background:#9c7526;"></span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#9c7526"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg>
        <span style="width:34px; height:1px; background:#9c7526;"></span>
      </div>
      <span style="font-family:'Noto Naskh Arabic', serif; font-weight:600; font-size:22px; color:#9c7526;">العام الدراسي 2026 <span dir="ltr">/</span> 2027</span>
    </div>

    <!-- Bottom: signatures -->
    <div style="width:100%; display:flex; flex-direction:column; gap:18px;">
      <div style="width:100%; height:1px; background:#e6dcc8;"></div>
      <div style="width:100%; display:flex; align-items:flex-end; justify-content:space-between;">
        <div style="text-align:center;">
          <div style="font-size:11px; color:#9c8a72; margin-bottom:6px;">رئيس القسم</div>
          <div style="font-size:15px; font-weight:700; color:#312f2a;">عمر الزنكي</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:11px; color:#9c8a72; margin-bottom:6px;">مدير المدرسة</div>
          <div style="font-size:15px; font-weight:700; color:#312f2a;">عبدالله عيسى خورشيد</div>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
