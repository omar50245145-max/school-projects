<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;background:#0f2540;overflow:hidden;font-family:'Tajawal',sans-serif;}
  .content{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 90px;text-align:center;}
  .logo-badge{width:190px;height:190px;border-radius:28px;background:#fdf9f0;box-shadow:0 14px 30px -10px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px;box-sizing:border-box;margin-bottom:56px;}
  .logo-badge img{width:100%;height:100%;object-fit:contain;}
  .thanks{color:#c4a45a;font-size:38px;font-weight:700;letter-spacing:2px;margin-bottom:22px;}
  h1{color:#fdf9f0;font-size:64px;font-weight:900;line-height:1.5;margin:0;text-wrap:balance;}
</style>
</head>
<body>
  <div class="content">
    <div class="logo-badge"><img src="logos/dept-logo.jpeg" alt="شعار القسم"></div>
    <div class="thanks">مع تحيات</div>
    <h1>قسم التربية الإسلامية</h1>
  </div>
</body>
</html>
