<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;background:#0f2540;overflow:hidden;font-family:'Tajawal',sans-serif;}
  .logo-badge{position:absolute;top:70px;width:180px;height:180px;border-radius:26px;background:#fdf9f0;box-shadow:0 14px 30px -10px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:14px;box-sizing:border-box;}
  .logo-badge img{width:100%;height:100%;object-fit:contain;}
  .logo-right{right:70px;}
  .logo-left{left:70px;}
  .content{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 90px;text-align:center;}
  .eyebrow{color:#c4a45a;font-size:38px;font-weight:700;letter-spacing:2px;margin-bottom:34px;}
  h1{color:#fdf9f0;font-size:86px;font-weight:900;line-height:1.45;margin:0 0 46px;text-wrap:balance;}
  .divider{width:140px;height:5px;background:#c4a45a;border-radius:3px;margin-bottom:46px;}
  .presenter{color:#e7e2d6;font-size:42px;font-weight:500;margin-bottom:20px;}
  .presenter b{color:#fdf9f0;font-weight:700;}
  .year{color:#8fa3ba;font-size:30px;font-weight:500;letter-spacing:1px;}
</style>
</head>
<body>
  <div class="logo-badge logo-right"><img src="logos/school-logo.jpeg" alt="شعار المدرسة"></div>
  <div class="logo-badge logo-left"><img src="logos/dept-logo.jpeg" alt="شعار القسم"></div>
  <div class="content">
    <div class="eyebrow">ورشة عمل</div>
    <h1>أول يوم دراسي<br>مع الطلبة</h1>
    <div class="divider"></div>
    <div class="presenter">تقديم الأستاذ / <b>عبداللطيف الدهيم</b></div>
    <div class="year">العام الدراسي 2026 / 2027</div>
  </div>
</body>
</html>
